[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -q
    --tb=short
    --strict-markers
    --strict-config
    -ra
pythonpath = src

# Markers
markers =
    integration: full end-to-end simulations (deselect with '-m "not integration"')

# Coverage (used when --cov passed)
[coverage:run]
source = financial_simulator
branch = True

[coverage:report]
precision = 1
show_missing = True
skip_covered = False
fail_under = 80

[coverage:html]
directory = htmlcov
