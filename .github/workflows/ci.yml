name: CI

on:
  push:
    branches: [main, testing, master]
  pull_request:
    branches: [main, testing, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (everything included)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests (fast suite, excluding integration and slow property tests)
        run: |
          python -m pytest tests/ -q -m "not integration and not slow" --cov=financial_simulator --cov-report=xml --cov-report=term

      - name: Run slow property-based tests
        run: |
          python -m pytest tests/ -q -m "slow" --tb=short

      - name: Run integration tests (optional)
        run: |
          python -m pytest tests/ -q -m "integration" --tb=short

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
