[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-simulator"
version = "0.3.0"
description = "Professional-grade stochastic financial modeling and Monte Carlo analysis platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Financial Simulator Contributors"}
]
keywords = ["monte-carlo", "simulation", "finance", "risk", "stochastic", "financial-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer[all]>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
app = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "pandas>=2.0",
]

[project.scripts]
simulate = "financial_simulator.cli:main"

[project.urls]
Homepage = "https://github.com/example/financial-simulator"
Repository = "https://github.com/example/financial-simulator"
Issues = "https://github.com/example/financial-simulator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["yaml.*", "typer.*"]
ignore_missing_imports = true
